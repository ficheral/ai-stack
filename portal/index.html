<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ai-stack</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#26303d; --fg:#e6edf3; --dim:#8b949e; --acc:#4a9eff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:56px 28px 28px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 8px; font-size:34px; letter-spacing:-.5px; }
  .sub { color:var(--dim); font-size:15px; }
  main { max-width:1100px; margin:0 auto; padding:8px 28px 72px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); }
  a.card { display:block; background:var(--card); border:1px solid var(--line);
           border-radius:12px; padding:18px 18px 16px; text-decoration:none; color:inherit;
           transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--acc); transform:translateY(-2px); }
  .ico { font-size:22px; line-height:1; margin-bottom:10px; display:block; }
  .tt { font-weight:600; margin-bottom:4px; }
  .ds { color:var(--dim); font-size:13.5px; }
  .tag { display:inline-block; margin-top:10px; font-size:11px; letter-spacing:.4px;
         text-transform:uppercase; color:var(--acc); border:1px solid #1e3a5f;
         background:#10233a; padding:3px 7px; border-radius:5px; }
  footer { max-width:1100px; margin:0 auto; padding:0 28px 48px; color:var(--dim); font-size:12.5px; }
  .off { opacity:.45; }
</style>
</head>
<body>
<header>
  <h1>ai-stack</h1>
  <div class="sub">Plataforma pessoal de IA &middot; roda no seu hardware &middot; GitHub para versionar e publicar</div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>
  Painel estatico (GitHub Pages). Cada servico abre no seu proprio endereco.
  Os que aparecem apagados nao estao no ar neste host.
</footer>
<script>
// Edite aqui os enderecos reais dos seus servicos.
const SERVICES = [
  { t:"Agente de IA",      d:"Chat com modelos locais, ferramentas e MCP",   u:"http://localhost:3080",  ico:"◆", tag:"LibreChat" },
  { t:"Imagem",            d:"Geracao e edicao por prompt, workflows salvos", u:"http://localhost:8188",  ico:"▣", tag:"ComfyUI" },
  { t:"Video",             d:"Cortes, legenda, montagem e modelos locais",    u:"#",                      ico:"▶", tag:"ffmpeg" },
  { t:"Codigo",            d:"Scripts, snippets e helpers",                   u:"#",                      ico:"{}",tag:"repo" },
  { t:"Documentos",        d:"PDF para Markdown, OCR, merge, assinatura",     u:"http://localhost:8080",  ico:"▤", tag:"Stirling" },
  { t:"Jogos",             d:"Projeto Godot: prototipo, build web",           u:"#",                      ico:"◈", tag:"Godot" },
  { t:"Seguranca",         d:"Varredura de imagem, codigo e site",            u:"#",                      ico:"⛨", tag:"Trivy" },
  { t:"Produtividade",     d:"RSS e monitor de paginas",                      u:"http://localhost:8081",  ico:"◎", tag:"FreshRSS" },
  { t:"GPU (Kaggle)",      d:"Jobs pesados de modelo, 30 h/semana gratis",    u:"https://www.kaggle.com/code", ico:"⚡", tag:"externo" },
];
const grid = document.getElementById("grid");
for (const s of SERVICES) {
  const a = document.createElement("a");
  a.className = "card" + (s.u === "#" ? " off" : "");
  a.href = s.u;
  if (s.u.startsWith("http")) a.target = "_blank", a.rel = "noopener";
  a.innerHTML = `<span class="ico">${s.ico}</span>
    <div class="tt">${s.t}</div>
    <div class="ds">${s.d}</div>
    <span class="tag">${s.tag}</span>`;
  grid.appendChild(a);
}
</script>
</body>
</html>
