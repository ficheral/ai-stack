name: Deploy portal to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare site
        run: |
          pip install --quiet markdown
          python scripts/build_pages.py --src docs --out _site --portal portal

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar compose (YAML)
        run: |
          pip install --quiet pyyaml
          python scripts/lint_repo.py

      - name: Python compila
        run: python -m py_compile services/docs/convert.py services/video/pipeline.py scripts/build_pages.py

      - name: Shell valido
        run: |
          for s in scripts/*.sh services/*/*.sh; do
            echo "checando $s"; bash -n "$s"
          done

      - name: Scripts executaveis no Git
        run: python scripts/lint_repo.py --exec-bit
