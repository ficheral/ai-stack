<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO}} · ai-stack</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#26303d;--fg:#e6edf3;--dim:#8b949e;--acc:#4a9eff}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:44px 28px 90px}
h1{font-size:32px;margin:0 0 20px;letter-spacing:-.5px}
h2{font-size:22px;margin:38px 0 12px;border-top:1px solid var(--line);padding-top:20px}
h3{font-size:18px;margin:26px 0 10px}
code{background:#1b2230;border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:13.5px}
pre{background:#0b0f16;border:1px solid var(--line);border-radius:10px;padding:16px 18px;overflow-x:auto}
pre code{background:none;border:none;padding:0;font-size:13px}
table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14.5px}
th,td{border:1px solid var(--line);padding:9px 13px;text-align:left}
th{background:#131a24}
a{color:var(--acc)}
blockquote{border-left:3px solid var(--acc);margin:18px 0;padding:2px 0 2px 18px;color:var(--dim);background:#10161f}
</style></head><body><main>{{CORPO}}</main></body></html>
