# Dominio: AGENTE DE IA
# Ollama (modelos locais) + LibreChat (interface, MIT) + OpenHands (agente que executa).
# Roda em CPU. Para GPU, adicione o bloco deploy.resources do host.

name: ai-stack-agent

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    ports: ["${PORT_OLLAMA:-11434}:11434"]
    volumes: ["${DATA_DIR:-/srv/ai-stack}/ollama:/root/.ollama"]
    # GPU NVIDIA: descomente as 2 linhas abaixo (precisa nvidia-container-toolkit)
    # deploy:
    #   resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } }

  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: ai-librechat
    restart: unless-stopped
    ports: ["${PORT_LIBRECHAT:-3080}:3080"]
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      ENDPOINTS__CUSTOM__0__name: "Ollama local"
      ENDPOINTS__CUSTOM__0__apiKey: "ollama"
      ENDPOINTS__CUSTOM__0__baseURL: "http://ollama:11434/v1"
      ENDPOINTS__CUSTOM__0__models__default: ["${OLLAMA_MODEL:-qwen2.5-coder:7b}"]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - "${DATA_DIR:-/srv/ai-stack}/librechat/uploads:/app/client/public/images"
    depends_on: [mongo, ollama]

  mongo:
    image: mongo:7
    container_name: ai-mongo
    restart: unless-stopped
    command: mongod --noauth
    volumes: ["${DATA_DIR:-/srv/ai-stack}/mongo:/data/db"]

  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    container_name: ai-openhands
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      LLM_MODEL: "ollama/${OLLAMA_MODEL:-qwen2.5-coder:7b}"
      LLM_BASE_URL: "http://ollama:11434"
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR:-/srv/ai-stack}/openhands:/.openhands"
