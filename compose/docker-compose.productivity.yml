# Dominio: PRODUTIVIDADE / ATUALIDADES
# FreshRSS (AGPL-3.0) leitor de feeds + changedetection.io (Apache-2.0) monitor de paginas.

name: ai-stack-prod

services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: ai-freshrss
    restart: unless-stopped
    ports: ["${PORT_FRESHRSS:-8081}:80"]
    environment:
      CRON_MIN: "*/30"
      TZ: America/Sao_Paulo
    volumes:
      - "${DATA_DIR:-/srv/ai-stack}/freshrss/data:/var/www/FreshRSS/data"
      - "${DATA_DIR:-/srv/ai-stack}/freshrss/extensions:/var/www/FreshRSS/extensions"

  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: ai-changedetect
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      TZ: America/Sao_Paulo
      PLAYWRIGHT_DRIVER_URL: ""
    volumes:
      - "${DATA_DIR:-/srv/ai-stack}/changedetection:/datastore"
